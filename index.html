<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #1a1a1a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .calculator { width: 320px; background: #2d2d2d; border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .display { background: #000; color: white; font-size: 2.5rem; text-align: right; padding: 20px; border-radius: 8px; margin-bottom: 20px; min-height: 60px; overflow-x: auto; }
    .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    button { font-size: 1.5rem; padding: 20px; border: none; border-radius: 8px; background: #3d3d3d; color: white; cursor: pointer; }
    button:active { background: #555; }
    button.operator { background: #ff9500; }
    button.equal { background: #007aff; grid-column: span 2; }
    button.clear { background: #ff3b30; }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="append('/')">/</button>
      <button onclick="append('*')">*</button>
      <button class="operator" onclick="append('-')">-</button>
      <button onclick="append('7')">7</button>
      <button onclick="append('8')">8</button>
      <button onclick="append('9')">9</button>
      <button class="operator" onclick="append('+')">+</button>
      <button onclick="append('4')">4</button>
      <button onclick="append('5')">5</button>
      <button onclick="append('6')">6</button>
      <button onclick="append('.')">.</button>
      <button onclick="append('1')">1</button>
      <button onclick="append('2')">2</button>
      <button onclick="append('3')">3</button>
      <button onclick="append('0')">0</button>
      <button class="equal" onclick="calculate()">=</button>
    </div>
  </div>
  <script>
    let display = document.getElementById('display');
    let current = '0';
    function updateDisplay() { display.textContent = current; }
    function append(val) {
      if (current === '0' && val !== '.') current = val;
      else current += val;
      updateDisplay();
    }
    function clearDisplay() { current = '0'; updateDisplay(); }
    function calculate() {
      try {
        current = eval(current.replace(/×/g, '*').replace(/÷/g, '/')).toString();
      } catch { current = 'Error'; }
      updateDisplay();
    }
  </script>
</body>
</html>
